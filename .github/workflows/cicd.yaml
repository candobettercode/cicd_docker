name: cicd-docker-simple_proj

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.11      
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r cicd-docker-simple_proj/requirements.txt

    - name: Run tests
      run: |
        pytest  

  build-and-publish:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: setup docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to DockerHub
      uses: docker/login-action@v2  
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4 
      with:
        context: .
        file: cicd-docker-simple_proj/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-docker-simple_proj:latest

    - name: Image digest
      run: echo "Image digest: ${{ steps.build-and-publish.outputs.digest }}"

      